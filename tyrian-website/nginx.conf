# ============================================
# Tyrian Global — Nginx Configuration
# /etc/nginx/sites-available/tyrian-global
# ============================================
# Bu dosyayi otomatik olarak deploy.sh kurar.
# Manuel kullanim icin:
#   sudo cp nginx.conf /etc/nginx/sites-available/tyrian-global
#   sudo ln -s /etc/nginx/sites-available/tyrian-global /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name tyrian-global.com www.tyrian-global.com;

    root /var/www/tyrian-global;
    index index.html;

    # Gzip sikistirma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/xml application/json
               image/svg+xml;

    # Cache — statik dosyalar (1 yil)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache — HTML dosyalari (1 saat)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Guvenlik basliklari
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # URL yonlendirme
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /index.html;

    # Gizli dosyalara erisim engeli
    location ~ /\. {
        deny all;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; allow all; }
}

